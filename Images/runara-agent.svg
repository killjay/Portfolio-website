<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 459" width="612" height="459" role="img" aria-label="Runara AI agent: metrics go to an agent that ranks issues critical to low, explains them, and in version two applies a fix the user approves before it deploys">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 10px; letter-spacing: 1.3px; fill: #1A1B1D; }
      .muted { font-family: 'JetBrains Mono', Menlo, monospace; font-size: 10px; letter-spacing: 1.3px; fill: rgba(26,27,29,0.62); }
      .serif { font-family: 'Libre Baskerville', Georgia, serif; font-size: 13px; fill: #1A1B1D; }
      .serif-i { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: 13px; fill: #A84E1F; }
      .node { fill: #F9F2E6; stroke: rgba(26,27,29,0.14); }
      .acc { fill: #F9F2E6; stroke: #C8632E; stroke-width: 1.5; }
      .line { stroke: rgba(26,27,29,0.4); stroke-width: 1.2; fill: none; }
      .lacc { stroke: #C8632E; stroke-width: 1.2; fill: none; }
      .dash { stroke: rgba(26,27,29,0.4); stroke-width: 1.2; fill: none; stroke-dasharray: 4 5; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="rgba(26,27,29,0.5)"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C8632E"/></marker>
  </defs>
  <rect width="612" height="459" fill="#D4D9E2"/>

  <text x="48" y="56" class="muted">RUNARA · AI AGENT · EXPLAIN, THEN FIX</text>

  <rect x="48" y="92" width="150" height="76" rx="8" class="node"/>
  <text x="64" y="118" class="mono">METRICS</text>
  <text x="64" y="142" class="serif">GPU and model</text>

  <path d="M198 130 H252" class="line" marker-end="url(#a)"/>

  <rect x="254" y="92" width="150" height="76" rx="8" class="acc"/>
  <text x="270" y="118" class="mono">AI AGENT</text>
  <text x="270" y="142" class="serif">What to fix, why</text>

  <path d="M404 112 H446 V89 H480" class="lacc" marker-end="url(#b)"/>
  <path d="M404 124 H458 V119 H480" class="line" marker-end="url(#a)"/>
  <path d="M404 136 H458 V149 H480" class="line" marker-end="url(#a)"/>
  <path d="M404 148 H446 V179 H480" class="line" marker-end="url(#a)"/>

  <rect x="482" y="76" width="90" height="26" rx="6" class="acc"/>
  <text x="494" y="93" class="mono">CRITICAL</text>
  <rect x="482" y="106" width="90" height="26" rx="6" class="node"/>
  <text x="494" y="123" class="mono">HIGH</text>
  <rect x="482" y="136" width="90" height="26" rx="6" class="node"/>
  <text x="494" y="153" class="mono">MEDIUM</text>
  <rect x="482" y="166" width="90" height="26" rx="6" class="node"/>
  <text x="494" y="183" class="mono">LOW</text>

  <line x1="48" y1="220" x2="564" y2="220" stroke="rgba(26,27,29,0.14)"/>

  <rect x="48" y="244" width="516" height="150" rx="8" class="node"/>
  <text x="68" y="272" class="muted">V1 · EXPLAIN</text>
  <text x="68" y="296" class="serif">What to fix and why, ranked critical to low.</text>
  <text x="68" y="330" class="muted">V2 · FIX · THREE MONTHS LATER</text>
  <text x="68" y="354" class="serif">The agent applies the fix and explains the change.</text>
  <text x="68" y="376" class="serif-i">The user approves it before it deploys.</text>

  <text x="48" y="428" class="serif">Runara</text>
  <text x="108" y="428" class="serif-i">metrics turned into fixes non-experts can approve</text>
</svg>
