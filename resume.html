    <script src="site.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script>
        // Render the PDF inline with pdf.js (native PDF embeds don't work on most phones),
        // then overlay its link annotations so email/LinkedIn/etc. stay clickable.
        window.addEventListener('DOMContentLoaded', async () => {
            const sheet = document.getElementById('resume-sheet');
            const status = sheet.querySelector('[data-status]');
            const src = sheet.dataset.pdf;
            // Fallback: the browser's own PDF viewer. Covers file:// previews, where
            // Chrome blocks pdf.js from fetching the PDF.
            const fail = () => {
                sheet.querySelectorAll('.resume-page').forEach((el) => el.remove());
                const frame = document.createElement('iframe');
                frame.className = 'resume-page resume-page--native';
                frame.src = `${src}#view=FitH&toolbar=0`;
                frame.title = 'Resume';
                status.replaceWith(frame);
            };
            if (!window.pdfjsLib) return fail();

            pdfjsLib.GlobalWorkerOptions.workerSrc =
                'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            try {
                const pdf = await pdfjsLib.getDocument(src).promise;
                const dpr = Math.min(window.devicePixelRatio || 1, 3);

                for (let n = 1; n <= pdf.numPages; n++) {
                    const page = await pdf.getPage(n);
                    const base = page.getViewport({ scale: 1 });
                    // Render at the sheet's max display width × DPR so it stays crisp; CSS scales it down.
                    const viewport = page.getViewport({ scale: (1000 / base.width) * dpr });

                    const wrap = document.createElement('div');
                    wrap.className = 'resume-page';
                    wrap.style.aspectRatio = `${base.width} / ${base.height}`;

                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(viewport.width);
                    canvas.height = Math.round(viewport.height);
                    canvas.setAttribute('role', 'img');
                    canvas.setAttribute('aria-label', `Resume page ${n} of ${pdf.numPages}`);
                    wrap.appendChild(canvas);
                    sheet.appendChild(wrap);

                    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

                    const annots = await page.getAnnotations();
                    annots.filter((a) => a.subtype === 'Link' && a.url).forEach((a) => {
                        const [x1, y1, x2, y2] = base.convertToViewportRectangle(a.rect);
                        const link = document.createElement('a');
                        link.className = 'resume-page__link';
                        link.href = a.url;
                        if (!a.url.startsWith('mailto:') && !a.url.startsWith('tel:')) {
                            link.target = '_blank';
                            link.rel = 'noopener';
                        }
                        link.setAttribute('aria-label', a.url.replace(/^(mailto:|tel:|https?:\/\/)/, ''));
                        link.style.left = `${(Math.min(x1, x2) / base.width) * 100}%`;
                        link.style.top = `${(Math.min(y1, y2) / base.height) * 100}%`;
                        link.style.width = `${(Math.abs(x2 - x1) / base.width) * 100}%`;
                        link.style.height = `${(Math.abs(y2 - y1) / base.height) * 100}%`;
                        wrap.appendChild(link);
                    });
                }
                status.remove();
            } catch (err) {
                console.error(err);
                fail();
            }
        });
    </script>
